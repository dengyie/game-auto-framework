[project]
name = "game-auto-framework"
version = "0.1.0"
description = "Industrial, general-purpose game automation and farming engine with DAG pipeline scheduling and anti-ban behavioral dynamics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "rapidfuzz>=3.8.0",
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "pillow>=10.3.0",
    "pytest>=8.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
cv = [
    "opencv-python>=4.9.0",
]
onnx = [
    "onnxruntime>=1.17.0",
]
ocr = [
    "rapidocr-onnxruntime>=1.3.0",
]
all = [
    "game-auto-framework[cv,onnx,ocr]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "scheduler", "plugins", "server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

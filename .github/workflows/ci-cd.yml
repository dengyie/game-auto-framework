name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    name: Quality Gate & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Setup Python & uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Project Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run Test Suite
        run: |
          uv run pytest tests/ \
            --ignore=tests/test_real_device_adb.py \
            --ignore=tests/test_real_game_acceptance.py \
            -v

      - name: Build Wheel & Source Distribution
        run: |
          uv build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: game-auto-framework-dist
          path: dist/
          retention-days: 30

  deploy-production:
    name: Deploy to Production VPS
    needs: test-and-package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key & Known Hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Sync Code to VPS via Rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.venv' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='logs/' \
            --exclude='reports/' \
            --exclude='config/accounts.json' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/deploy_key -p $VPS_PORT -o StrictHostKeyChecking=yes" \
            ./ "$VPS_USER@$VPS_HOST:/opt/game-auto-framework/"

      - name: Remote Update & Restart Service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s" << 'EOF'
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cd /opt/game-auto-framework

          echo "==> Updating dependencies with uv..."
          if command -v uv >/dev/null 2>&1; then
            uv sync --no-dev
          elif [ -f "$HOME/.cargo/bin/uv" ]; then
            "$HOME/.cargo/bin/uv" sync --no-dev
          fi

          echo "==> Reloading systemd and restarting game-auto.service..."
          systemctl daemon-reload
          systemctl restart game-auto.service

          echo "==> Verifying service health..."
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then
              echo "==> Service is healthy! (HTTP 200 OK)"
              exit 0
            fi
            echo "Waiting for service to become healthy (attempt $i/15)..."
            sleep 2
          done

          echo "==> Health check timed out!"
          systemctl status game-auto.service --no-pager
          exit 1
          EOF

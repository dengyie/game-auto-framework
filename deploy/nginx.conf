# Nginx Reverse Proxy Configuration for game-auto-framework Web Dashboard & API

upstream game_auto_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Rate limit zone: 20 requests per second per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # Gzip Compression for fast Dashboard load
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Access and Error Logs
    access_log /var/log/nginx/game_auto_access.log;
    error_log /var/log/nginx/game_auto_error.log warn;

    # Reverse proxy to FastAPI / Web Dashboard
    location / {
        proxy_pass http://game_auto_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for real-time dashboard updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-running routines & VLM requests
        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API endpoints with rate limiting
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://game_auto_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}

version: "3.8"

# ==============================================================================
# All-In-One Cloud Game Farm: Redroid Headless Android + Game-Auto-Framework
# Designed for high-density 7x24h multi-instance deployment on Linux VPS.
# ==============================================================================

services:
  redroid-instance-01:
    image: redroid/redroid:12.0.0-latest
    container_name: redroid-instance-01
    privileged: true
    restart: always
    ports:
      - "5555:5555"
    volumes:
      - redroid-data-01:/data
    command:
      - "androidboot.redroid_width=1280"
      - "androidboot.redroid_height=720"
      - "androidboot.redroid_dpi=320"
      - "androidboot.redroid_fps=30"
      - "ro.product.model=Pixel_6"
      - "ro.product.brand=google"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  game-auto-framework:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: game-auto-framework:latest
    container_name: game-auto-framework
    restart: always
    depends_on:
      - redroid-instance-01
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - LOGURU_LEVEL=INFO
      - DEFAULT_DEVICE_TYPE=adb
      - ADB_SERIAL=redroid-instance-01:5555
      - VLM_API_BASE=${VLM_API_BASE:-https://api.openai.com/v1}
      - VLM_API_KEY=${VLM_API_KEY:-}
      - VLM_MODEL=${VLM_MODEL:-gpt-4o-mini}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL:-}
      - WECHAT_WEBHOOK_URL=${WECHAT_WEBHOOK_URL:-}
    volumes:
      - ../plugins:/app/plugins
      - ../logs:/app/logs
      - ../config:/app/config
      - ../screenshots:/app/screenshots
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  redroid-data-01:
